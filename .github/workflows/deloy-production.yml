name: Deploy on VPS

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: tankien/api_chat:v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # BƯỚC MỚI: Copy file docker-compose.yml từ repository lên VPS
      - name: Checkout code (để lấy file docker-compose.yml)
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: /home/production/api-pj2-chat-app

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}

            # Chuyển vào đúng thư mục vừa copy file sang
            cd /home/production/api-pj2-chat-app

            # Ghi file .env
            echo "${{ secrets.ENV_PRODUCTION }}" > .env

            # Kéo image mới và khởi chạy
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
