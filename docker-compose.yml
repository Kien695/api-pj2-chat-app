services:
  app:
    build: .
    image: tankien/api_chat:v2
    container_name: server-chat-api
    platform: linux/amd64
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis_chat
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # expose:
    #   - "6379" # Chỉ cho phép các container cùng mạng truy cập, không mở ra Internet
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
