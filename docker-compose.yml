services:
  app:
    image: tankien/api_chat:v3
    container_name: server-chat-api
    platform: linux/amd64
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_chat
    command: redis-server --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
